# Local (kind) overlay — the only overlay that exists in phase 1.
#
# This is the path Argo CD will point at in phase 5, which means every value here
# is changed by editing a file and committing it. Never with `kubectl edit`.
#
# Render it without a cluster:   make k8s-build
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace is NOT created here: Terraform owns namespaces (ADR-0004). This
# line only places the resources into it.
namespace: hello-devops

resources:
  - ../../base

# Two replicas so a rolling update is actually observable: refresh the page and
# watch the pod name alternate.
replicas:
  - name: hello-devops
    count: 2

# The single line that a deployment is: change the tag, commit, and Argo CD rolls
# it out. Phase 6 replaces this with a digest written by CI.
images:
  - name: hello-devops
    newTag: 0.1.0

# Generated ConfigMap. Kustomize appends a content hash to the name and rewrites
# the reference in the Deployment, so editing a value here triggers a real rollout
# instead of leaving pods running with stale config.
configMapGenerator:
  - name: hello-devops-config
    literals:
      - APP_ENV=kind
      - LOG_LEVEL=info

# APP_VERSION is set from the image tag rather than generated config, so the
# reported version can never drift from the artifact actually running.
patches:
  - target:
      kind: Deployment
      name: hello-devops
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_VERSION
          value: "0.1.0"
