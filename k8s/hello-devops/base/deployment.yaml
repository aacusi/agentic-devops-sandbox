# hello-devops Deployment — environment-agnostic base.
#
# NOT APPLIED TO ANY CLUSTER YET. Phase 4 applies this via Kustomize; phase 5
# hands it to Argo CD. There is intentionally no `namespace:` here — the overlay
# sets it, so the same base can be reused for other environments later.
#
# The image tag below is a placeholder that the overlay replaces. It is NOT
# `latest`, on purpose: an immutable tag means a rollout is a real diff in Git and
# a rollback is a real revert.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-devops
  labels:
    app.kubernetes.io/name: hello-devops
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: agentic-devops-sandbox
    app.kubernetes.io/managed-by: kustomize
spec:
  # Overridden per environment by the overlay.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the desired capacity while rolling: with readiness
      # probes wired up correctly this gives a zero-downtime update.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-devops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-devops
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: agentic-devops-sandbox
    spec:
      # Pod-level security context. kind honours all of this, and it is the same
      # posture a hardened production cluster would require.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Give the process time to shut down after readiness is withdrawn.
      terminationGracePeriodSeconds: 20
      containers:
        - name: app
          # Replaced by the overlay's `images:` transformer.
          image: hello-devops:0.1.0
          # IfNotPresent is required for images side-loaded with `kind load`:
          # there is no registry to pull from in phases 4-5.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # The downward API is how the app learns which pod it is. This is what
            # makes a rolling update visible in the browser.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            # Generated by the overlay (configMapGenerator) so a config change
            # produces a new ConfigMap name and therefore a real rollout.
            - configMapRef:
                name: hello-devops-config
          # Liveness: "is the process broken?" -> restart. Must not depend on
          # anything external.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: "should this pod get traffic?" -> add/remove from Service.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          # Startup probe lets the app boot slowly without a lax liveness probe.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          # Requests are what the scheduler uses; limits are the hard ceiling.
          # Small values on purpose — this runs on a laptop.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem means the app needs a writable /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
