# Helm values for the argo-cd chart on a laptop kind cluster.
#
# Chart: argo/argo-cd  (https://argoproj.github.io/argo-helm)
# Pinned by: var.argocd_chart_version in infra/terraform/environments/local/variables.tf
#
# Three things this file is responsible for, and nothing else:
#   1. One replica of everything. HA is meaningless on a three-node kind cluster.
#   2. Requests small enough that Argo CD and the app coexist on a laptop.
#   3. No route into the cluster from outside it. ClusterIP only, TLS terminated
#      nowhere, reachable exclusively via `kubectl port-forward`.
#
# NOT set here, on purpose: any Git credential, any repository URL, any admin
# password. Repository wiring is a separate deliberate step, and the initial
# admin password is generated by the chart into a Secret (never committed).

# CRDs are cluster-scoped — the one part of this install that is not confined to
# the argocd namespace. keep: false (chart default is true) so that uninstalling
# leaves nothing behind; on a sandbox, a clean teardown matters more than
# protecting Application objects from an accidental `helm uninstall`.
crds:
  install: true
  keep: false

global:
  # Modest floor for every component. Requests are what the scheduler reserves;
  # keeping them honest is what lets a 3-node kind cluster run Argo CD plus the
  # application without pods going Pending.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

configs:
  params:
    # Serve plain HTTP inside the cluster. There is no ingress and no TLS
    # terminator in front of Argo CD here, so leaving the server in its default
    # self-signed-TLS mode only produces redirect loops behind port-forward.
    #
    # This is safe ONLY because the service is ClusterIP: the plaintext listener
    # is not reachable from outside the cluster. It would be wrong the moment an
    # Ingress is put in front of it.
    server.insecure: true

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------

# Reconciles Applications against Git. The component that does the actual work.
controller:
  replicas: 1

# API + web UI. Reached only through `kubectl port-forward svc/argocd-server`.
server:
  replicas: 1
  service:
    # ClusterIP, explicitly. NodePort or LoadBalancer would publish Argo CD on
    # the host — and the kind control plane already forwards host ports 80/443,
    # so a mistake here would be immediately internet-adjacent.
    type: ClusterIP

# Clones Git and renders manifests (runs `kustomize build` for this repo).
repoServer:
  replicas: 1

# ApplicationSet controller — templated generation of many Applications.
# The phase 5 plan is app-of-apps (plain Application objects), which does not
# need this. Left enabled at one replica because it is part of a standard
# install and costs one idle pod; set enabled: false to reclaim it.
applicationSet:
  replicas: 1

# Dex is the SSO broker. There is no identity provider in this sandbox — login
# is the local admin account only — so it would be an idle pod with no purpose.
dex:
  enabled: false

# Notifications needs somewhere to send notifications. There is nowhere.
notifications:
  enabled: false

# Argo CD's cache. Single non-HA instance (the chart default); redis-ha stays off.
redis:
  enabled: true
