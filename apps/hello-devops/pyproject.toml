[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-devops"
version = "0.1.0"
description = "Minimal web app used to demonstrate a Docker -> kind -> Argo CD delivery chain"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

# Version ranges are used here so `make install` resolves on any recent Python.
# Phase 2 pins exact versions (and adds a lock file) for reproducible images —
# reproducibility matters in the artifact we ship, not in the dev shell.

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
